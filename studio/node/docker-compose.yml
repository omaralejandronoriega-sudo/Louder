services:
  louder-playout:
    build: .
    restart: unless-stopped
    environment:
      CONTROL_API_TOKEN: ${CONTROL_API_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      YESSTREAMING_HOST: ${YESSTREAMING_HOST}
      YESSTREAMING_PORT: ${YESSTREAMING_PORT:-2720}
      YESSTREAMING_USER: ${YESSTREAMING_USER:-source}
      YESSTREAMING_PASSWORD: ${YESSTREAMING_PASSWORD}
      YESSTREAMING_MOUNT: ${YESSTREAMING_MOUNT:-/stream}
      MIC_HARBOR_PASSWORD: ${MIC_HARBOR_PASSWORD}
      MIC_HARBOR_URL: icecast://source:${MIC_HARBOR_PASSWORD}@127.0.0.1:8005/mic
    ports:
      - "8787:8787"
    volumes:
      - louder_state:/app/state

volumes:
  louder_state:
