name: Louder Artist Identity Fallback

on:
  push:
    branches: [main]
    paths:
      - "scripts/enrich_identity_fallback.py"
      - "scripts/enrichment_state.py"
      - ".github/workflows/artistas-identity-fallback.yml"
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: "Volver a consultar casos ya revisados"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: louder-artistas-identity-fallback
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m py_compile scripts/*.py live/*.py

      - name: Rebuild current artist universe
        run: python scripts/merge_history_sources.py

      - name: Resolve unresolved identities conservatively
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.refresh }}" = "true" ]; then
            EXTRA="--refresh"
          fi
          python scripts/enrich_identity_fallback.py --limit 400 $EXTRA

      - name: Save identity fallback metadata
        shell: bash
        run: |
          git checkout -- data/artists.json
          git config user.name "louder-artistas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/identity_enrichment.json
          if git diff --cached --quiet; then
            echo "No identity enrichment changes"
          else
            git commit -m "Update artist identity fallback metadata"
            git pull --rebase origin main
            git push
          fi

      - name: Report real remaining gaps
        run: python scripts/audit_artistas.py
