name: Louder Artistas Galleries

on:
  workflow_run:
    workflows: ["Louder Artistas"]
    types: [completed]
  schedule:
    - cron: "23 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: "Volver a consultar galerías existentes"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: louder-artistas-gallery
  cancel-in-progress: true

jobs:
  galleries:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m py_compile scripts/*.py live/*.py

      - name: Merge complete artist universe
        run: python scripts/merge_history_sources.py

      - name: Build gallery manifests in safe batches
        shell: bash
        env:
          FANART_TV_API_KEY: ${{ secrets.FANART_TV_API_KEY }}
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.refresh }}" = "true" ]; then
            EXTRA="--refresh"
          fi
          python scripts/enrich_galleries.py --limit 500 $EXTRA

      - name: Save gallery metadata
        shell: bash
        run: |
          git checkout -- data/artists.json
          git config user.name "louder-artistas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/galleries.json
          if git diff --cached --quiet; then
            echo "No gallery changes"
          else
            git commit -m "Update Artistas galleries"
            git pull --rebase origin main
            git push
          fi
