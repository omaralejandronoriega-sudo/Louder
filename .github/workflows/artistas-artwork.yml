name: Louder Artistas Artwork

on:
  workflow_run:
    workflows: ["Louder Artistas"]
    types: [completed]
  schedule:
    - cron: "41 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: louder-artistas-artwork
  cancel-in-progress: true

jobs:
  artwork:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m py_compile scripts/*.py live/*.py

      - name: Resolve a safe batch of missing covers
        run: python scripts/enrich_album_art.py --limit 150

      - name: Save artwork metadata
        shell: bash
        run: |
          git config user.name "louder-artistas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/album_art.json
          if git diff --cached --quiet; then
            echo "No artwork changes"
          else
            git commit -m "Update Artistas album artwork"
            git pull --rebase origin main
            git push
          fi
