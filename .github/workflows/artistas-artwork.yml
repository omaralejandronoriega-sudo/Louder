name: Louder Artistas Artwork

on:
  workflow_run:
    workflows: ["Louder Artistas"]
    types: [completed]
  schedule:
    - cron: "41 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: louder-artistas
  cancel-in-progress: false

jobs:
  artwork:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Resolve a safe batch of missing covers
        run: python scripts/enrich_album_art.py --limit 150

      - name: Build static Artistas
        run: python scripts/build_artists.py

      - name: Save artwork metadata
        shell: bash
        run: |
          git config user.name "louder-artistas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/album_art.json docs/
          if git diff --cached --quiet; then
            echo "No artwork changes"
          else
            git commit -m "Update Artistas album artwork"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
