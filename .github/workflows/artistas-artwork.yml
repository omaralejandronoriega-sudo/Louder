name: Louder Artistas Artwork

on:
  schedule:
    - cron: "41 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: louder-artistas-artwork
  cancel-in-progress: true

jobs:
  artwork:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m py_compile scripts/*.py live/*.py

      - name: Merge complete artist universe
        run: python scripts/merge_history_sources.py

      - name: Resolve missing covers in safe batches
        run: python scripts/enrich_album_art.py --limit 400

      - name: Save artwork metadata
        shell: bash
        run: |
          git checkout -- data/artists.json
          git config user.name "louder-artistas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/album_art.json
          if git diff --cached --quiet; then
            echo "No artwork changes"
          else
            git commit -m "Update Artistas album artwork"
            git pull --rebase origin main
            git push
          fi
