name: Deploy Louder Artistas Edge

on:
  push:
    branches: [main]
    paths:
      - "edge/**"
      - ".github/workflows/deploy-artistas-edge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: louder-artistas-edge
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Worker syntax
        run: node --check edge/cloudflare-worker.js

      - name: Validate required Cloudflare secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Deploy Louder edge worker
        working-directory: edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Configure OpenAI server secret when available
        working-directory: edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            printf '%s' "$OPENAI_API_KEY" | npx --yes wrangler@4 secret put OPENAI_API_KEY
          else
            echo "OPENAI_API_KEY is not configured; skipping optional AI secret."
          fi

      - name: Smoke test OpenAI Responses API
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY not configured; skipping smoke test."
            exit 0
          fi
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' https://api.openai.com/v1/responses \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"model":"gpt-6-sol","input":"Reply only with OK","store":false,"max_output_tokens":32}')"
          if [ "$code" != "200" ]; then
            cat "$tmp"
            echo
            echo "OpenAI smoke test failed with HTTP $code"
            exit 1
          fi
          python - "$tmp" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          if data.get("status") not in {"completed","in_progress"}:
              raise SystemExit(f"Unexpected Responses API status: {data.get('status')!r}")
          print("OpenAI Responses API smoke test: OK")
          PY
