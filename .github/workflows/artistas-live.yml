name: Louder Artistas Live

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: louder-static-pages
  cancel-in-progress: true

jobs:
  sync-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m py_compile scripts/*.py live/*.py

      - name: Merge historical sources
        run: python scripts/merge_history_sources.py

      - name: Apply new YesStreaming history without WordPress
        run: python live/sync_history.py --require-min 7000

      - name: Build all static sections
        run: |
          python scripts/build_artists.py
          python scripts/build_radar_2026.py
          python scripts/build_control.py

      - name: Validate Louder Control PWA
        shell: bash
        run: |
          test -s docs/control/index.html
          test -s docs/artistas/_control/index.html
          test -s docs/control/sw.js
          test -s docs/control/manifest.webmanifest
          python -m json.tool docs/control/manifest.webmanifest >/dev/null
          node --check docs/control/sw.js
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('docs/control/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?![^>]*application\/json)[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
          if(!scripts.length) throw new Error('No app JavaScript found');
          fs.writeFileSync('/tmp/louder-control.js',scripts.join('\n'));
          NODE
          node --check /tmp/louder-control.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
