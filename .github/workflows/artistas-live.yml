name: Louder Artistas Live

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_run:
    workflows: ["Publish Louder Static Sections"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: louder-static-pages
  cancel-in-progress: true

jobs:
  sync-build-deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m py_compile scripts/*.py live/*.py

      - name: Merge historical sources
        run: python scripts/merge_history_sources.py

      - name: Apply new YesStreaming history without WordPress
        run: python live/sync_history.py --require-min 7000

      - name: Build all static sections
        run: |
          python scripts/build_artists.py
          python scripts/build_radar_2026.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
