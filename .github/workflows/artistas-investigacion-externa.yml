name: Louder Artistas - investigación externa segura

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/artistas-investigacion-externa.yml"
      - "scripts/research_artist_identities_offhost.py"
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: louder-artists-offhost-research
  cancel-in-progress: false

jobs:
  review-identities:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate script
        run: python -m py_compile scripts/research_artist_identities_offhost.py
      - name: Validate catalog parsing without network
        run: python -m unittest discover -s tests -p 'test_offhost_artist_research.py'
      - name: Research next group entirely on GitHub
        env:
          BATCH_SIZE: "20"
        run: python scripts/research_artist_identities_offhost.py
      - name: Save reviewed candidates and resume cursor in GitHub
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Louder Artist Research Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/identity_research_progress.json
          if ! git diff --cached --quiet; then
            git commit -m "artistas: save off-host research progress"
            # Gallery and artwork jobs also commit to main.
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                break
              fi
              if [[ "$attempt" == "3" ]]; then
                echo "Could not save progress after three attempts."
                exit 1
              fi
              sleep $((attempt * 3))
            done
          fi
      - name: Keep candidate report for editorial review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: louder-artistas-revision-${{ github.run_id }}
          path: artifacts/artist-review/
          if-no-files-found: warn
          retention-days: 14
