name: Agencia Louder - Produccion IA
on:
  workflow_dispatch:
  issues:
    types: [opened, labeled, edited, reopened]
permissions:
  contents: read
  issues: write
  models: read
  copilot-requests: write
concurrency:
  group: agencia-issue-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  producir:
    if: contains(github.event.issue.labels.*.name, 'agencia-orden') && !contains(github.event.issue.labels.*.name, 'agencia-produccion')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Preparar contexto Louder
        env:
          ORDER_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import os, urllib.request
          def read(url):
              try: return urllib.request.urlopen(url, timeout=20).read().decode("utf-8")
              except Exception as e: return "FUENTE NO DISPONIBLE: "+str(e)
          order=os.environ.get("ORDER_BODY","")
          core=read("https://raw.githubusercontent.com/omaralejandronoriega-sudo/agencia/main/knowledge/louder-core.json")
          eph=read("https://raw.githubusercontent.com/omaralejandronoriega-sudo/agencia/main/data/ephemerides.json")
          import json
          try:
              corej=json.loads(core)
              core=json.dumps({k:corej.get(k) for k in ["identity","music_policy","editorial","design","training"] if k in corej},ensure_ascii=False)
          except: core=core[:18000]
          try:
              ej=json.loads(eph)
              eph=json.dumps([x for x in ej.get("items",[]) if x.get("day")=="10-06"],ensure_ascii=False)
          except: eph=eph[:12000]
          roster={
"Paula Serrano":"Relaciones de Prensa","Mariana Vélez":"Coordinadora de Acreditaciones","Valeria Cruz":"Directora editorial","Tomás Arriaga":"Periodista musical","Elena Vidal":"Curadora musical","Gael Robles":"Productor de contenidos","Leo Barragán":"Supervisor de operaciones","Camila Ortega":"Analista de audiencia","Mateo Ríos":"Editor TikTok","Inés Beaumont":"Diseñadora TBC","Arthur Vega":"CM TBC","Mara Vértiz":"Diseñadora Threads","Nico Ferrer":"CM Threads","Renata Solís":"Diseñadora Louder","Diego Lunares":"Editor video Louder","Sofía Alcázar":"CM Louder","Bruno Leal":"Webmaster Louder"}
          prompt=("Eres el dispatcher operativo de Agencia Louder. Ejecuta literalmente la ORDEN; no reutilices paquetes, fechas o temas anteriores. Devuelve SOLO JSON valido. "
                  "Si la orden pide varios trabajadores, devuelve una entrada por cada trabajador solicitado. Cada uno trabaja desde su rol y debe incluir el ARTEFACTO COMPLETO dentro de entrega, no una descripcion ni promesa. "
                  "PROHIBIDO marcar estado entregado si entrega solo dice cosas como nota preparada, brief listo, copies listos, publicacion lista, revision hecha o equivalentes sin mostrar el contenido completo. "
                  "Para texto: incluye texto final. Para diseño: brief completo con jerarquia, copy, medidas, activos reales requeridos y layout. Para video: guion por tiempos, voz, visual y edicion. Para redes: copy final separado por red. Para web: titulo, slug, cuerpo/estructura, metadatos y checklist de evidencia. Para prensa: solicitud o expediente completo. Para metricas: tabla/lectura y recomendacion; si no hay datos reales, bloqueado_parcial. "
                  "No inventes acceso a correo, metricas, WordPress, Canva, Figma, renders, archivos, fuentes ni publicaciones. Si falta un recurso externo, completa lo posible y decláralo en dependencias_reales. "
                  "Diseño Louder: no imagenes IA; solo fotografia, portada, flyer o material real/autorizado. No publiques nada. Valeria revisa y Omar autoriza manualmente. "
                  "Esquema: {summary:string,workers:[{worker:string,role:string,tarea_recibida:string,entrega:object,dependencias_reales:array,estado:entregado|bloqueado_parcial}],valeria_review:{status:string,observaciones:array},approval:'Pendiente de Omar'}. Valeria solo puede aprobar una pieza si el artefacto es visible y revisable en el JSON; si falta contenido debe rechazarla con observaciones concretas. "
                  "EQUIPO Y ROLES: "+json.dumps(roster,ensure_ascii=False)+"\n\nORDEN:\n"+order+"\n\nREGLAS LOUDER:\n"+core)
          open("agencia-prompt.txt","w").write(prompt)
          PY

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Instalar Copilot CLI
        run: npm install -g @github/copilot

      - name: Ejecutar equipo editorial con Copilot
        id: ai
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot -p "$(cat agencia-prompt.txt)" -s --no-ask-user --model gpt-4.1 > agencia-result.txt
          test -s agencia-result.txt

      - name: Respaldo local sin API
        if: steps.ai.outcome == 'failure'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve >/tmp/ollama.log 2>&1 &
          sleep 4
          ollama pull qwen3:4b
          python - <<'PY'
          import json,urllib.request
          prompt=open("agencia-prompt.txt").read()
          body=json.dumps({"model":"qwen3:4b","prompt":prompt,"stream":False,"format":"json","think":False,"options":{"temperature":0.1,"num_predict":12000}}).encode()
          req=urllib.request.Request("http://127.0.0.1:11434/api/generate",data=body,headers={"Content-Type":"application/json"})
          data=json.loads(urllib.request.urlopen(req,timeout=600).read())
          out=data.get("response","").strip()
          if not out: raise SystemExit("El motor local no devolvio contenido")
          open("agencia-result.txt","w").write(out)
          PY

      - name: Registrar incidencia del motor
        if: failure() && !hashFiles('agencia-result.txt')
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({...context.repo,issue_number:context.issue.number,body:'## Incidencia · motor de producción\n\nEl ejecutor Copilot no pudo completar la producción. Revisar la autorización de Copilot CLI para GitHub Actions. La orden permanece bloqueada y no suma avance.'});
            await github.rest.issues.addLabels({...context.repo,issue_number:context.issue.number,labels:['agencia-incidencia']});

      - name: Validar calidad del entregable
        if: hashFiles('agencia-result.txt') != ''
        run: |
          python - <<'PY'
          import json,re
          p='agencia-result.txt'
          try: data=json.load(open(p))
          except Exception as e: raise SystemExit('JSON invalido: '+str(e))
          bad=[]
          workers=data.get('workers',[])
          if not workers: bad.append('sin workers')
          generic=re.compile(r'^(nota|brief|copy|copias|plan|paquete|video|diseño|publicaci[oó]n|listado|evidencia).{0,80}(preparad|generad|list|realizad|requerid|optimizado)',re.I)
          for w in workers:
            ent=w.get('entrega',{})
            blob=json.dumps(ent,ensure_ascii=False)
            if w.get('estado')=='entregado' and len(blob)<180: bad.append(w.get('worker','?')+': artefacto demasiado corto')
            if w.get('estado')=='entregado' and generic.search(str(next(iter(ent.values()),''))): bad.append(w.get('worker','?')+': descripcion generica marcada como entrega')
            if not w.get('dependencias_reales') and any(x in (w.get('role','').lower()) for x in ['diseñ','video','webmaster','audiencia','prensa','acredit']): bad.append(w.get('worker','?')+': faltan dependencias reales')
          data['qa']={'passed':not bad,'errors':bad}
          if bad:
            for w in workers:
              if w.get('estado')=='entregado': w['estado']='bloqueado_parcial'
            data.setdefault('valeria_review',{})['status']='RECHAZADO_QA'
            data['valeria_review']['observaciones']=bad
          open(p,'w').write(json.dumps(data,ensure_ascii=False,indent=2))
          PY

      - name: Guardar entrega en expediente
        if: hashFiles('agencia-result.txt') != ''
        uses: actions/github-script@v7
        env:
          RESULT_FILE: agencia-result.txt
        with:
          script: |
            const fs=require('fs');
            const result=fs.existsSync(process.env.RESULT_FILE)?fs.readFileSync(process.env.RESULT_FILE,'utf8'):'INCIDENCIA: el ejecutor no devolvio contenido.';
            const body='## Entrega del equipo Louder\n\n'+result+'\n\n---\n**Publicacion bloqueada:** requiere autorizacion manual de Omar en Agencia.';
            await github.rest.issues.createComment({...context.repo,issue_number:context.issue.number,body:body.slice(0,65000)});
            await github.rest.issues.addLabels({...context.repo,issue_number:context.issue.number,labels:['agencia-produccion']});
            await github.rest.issues.removeLabel({...context.repo,issue_number:context.issue.number,name:'agencia-orden'}).catch(()=>{});
