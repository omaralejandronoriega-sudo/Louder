name: Agencia Louder - Produccion IA
on:
  issues:
    types: [opened, labeled]
permissions:
  contents: read
  issues: write
  models: read
  copilot-requests: write
concurrency:
  group: agencia-issue-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  producir:
    if: contains(github.event.issue.labels.*.name, 'agencia-orden')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Preparar contexto Louder
        env:
          ORDER_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import os, urllib.request
          def read(url):
              try: return urllib.request.urlopen(url, timeout=20).read().decode("utf-8")
              except Exception as e: return "FUENTE NO DISPONIBLE: "+str(e)
          order=os.environ.get("ORDER_BODY","")
          core=read("https://raw.githubusercontent.com/omaralejandronoriega-sudo/agencia/main/knowledge/louder-core.json")
          eph=read("https://raw.githubusercontent.com/omaralejandronoriega-sudo/agencia/main/data/ephemerides.json")
          radar=read("https://raw.githubusercontent.com/omaralejandronoriega-sudo/Louder/main/data/radar_2026.json")
          prompt="""Eres el equipo real de produccion editorial de Louder. Ejecuta la orden, no expliques un plan.
          Respeta el conocimiento Louder y evita lenguaje generico de IA.
          No inventes noticias ni datos actuales: si no estan sustentados, marca REQUIERE VERIFICACION.
          Para cada pieza entrega: titulo, responsable, colaboradores, investigacion/criterio, copy final separado por red,
          brief visual o guion de video, redes, hora sugerida, fuentes/base usada, materiales que faltan y estado.
          Una pieza NO esta LISTA si falta imagen, video, copy, revision o fuente.
          Termina con una seccion AVISOS AL DIRECTOR: un aviso individual por trabajador que haya terminado una entrega.
          Ninguna pieza queda autorizada para publicar: todas deben decir APROBACION OMAR: PENDIENTE.
          
          ORDEN:
          """+order+"\n\nCONOCIMIENTO LOUDER:\n"+core[:30000]+"\n\nEFEMERIDES:\n"+eph[:30000]+"\n\nRADAR:\n"+radar[:25000]
          open("agencia-prompt.txt","w").write(prompt)
          PY

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Instalar Copilot CLI
        run: npm install -g @github/copilot

      - name: Ejecutar equipo editorial con Copilot
        id: ai
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot -p "$(cat agencia-prompt.txt)" -s --no-ask-user --model gpt-4.1 > agencia-result.txt
          test -s agencia-result.txt

      - name: Respaldo local sin API
        if: steps.ai.outcome == 'failure'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve >/tmp/ollama.log 2>&1 &
          sleep 4
          ollama pull qwen3:1.7b
          python - <<'PY'
          import json,urllib.request
          prompt=open("agencia-prompt.txt").read()
          body=json.dumps({"model":"qwen3:1.7b","prompt":prompt,"stream":False,"options":{"temperature":0.25,"num_predict":5000}}).encode()
          req=urllib.request.Request("http://127.0.0.1:11434/api/generate",data=body,headers={"Content-Type":"application/json"})
          data=json.loads(urllib.request.urlopen(req,timeout=600).read())
          out=data.get("response","").strip()
          if not out: raise SystemExit("El motor local no devolvio contenido")
          open("agencia-result.txt","w").write(out)
          PY

      - name: Registrar incidencia del motor
        if: failure() && !hashFiles('agencia-result.txt')
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({...context.repo,issue_number:context.issue.number,body:'## Incidencia · motor de producción\n\nEl ejecutor Copilot no pudo completar la producción. Revisar la autorización de Copilot CLI para GitHub Actions. La orden permanece bloqueada y no suma avance.'});
            await github.rest.issues.addLabels({...context.repo,issue_number:context.issue.number,labels:['agencia-incidencia']});

      - name: Guardar entrega en expediente
        if: hashFiles('agencia-result.txt') != ''
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.ai.outputs.response }}
        with:
          script: |
            const result=fs.existsSync(process.env.RESULT_FILE)?fs.readFileSync(process.env.RESULT_FILE,'utf8'):'INCIDENCIA: el ejecutor no devolvio contenido.';
            const body='## Entrega del equipo Louder\n\n'+result+'\n\n---\n**Publicacion bloqueada:** requiere autorizacion manual de Omar en Agencia.';
            await github.rest.issues.createComment({...context.repo,issue_number:context.issue.number,body:body.slice(0,65000)});
            await github.rest.issues.addLabels({...context.repo,issue_number:context.issue.number,labels:['agencia-produccion']});
