name: Cloud Studio CI
on:
  push:
    branches: [cloud-studio-v1]
    paths: ["studio/**", ".github/workflows/cloud-studio-ci.yml"]
  pull_request:
    paths: ["studio/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Browser code syntax
        run: node --check studio/app.js
      - name: API code syntax
        run: python -m py_compile studio/node/app.py
      - name: Required modules
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("studio/index.html").read_text()
          required=["Voice FX / Microphone","Encoders","PAL Scripts","Clockwheel","Event Scheduler","Crossfade Rules","Audio Mixer Pipeline","Sound FX","Deck A","Deck B"]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit("Missing: "+", ".join(missing))
          print("All required studio modules present.")
          PY
      - name: Liquidsoap 2.3.3 typecheck
        run: |
          docker run --rm \
            -v "$PWD/studio/node/radio.liq:/app/radio.liq:ro" \
            savonet/liquidsoap:v2.3.3 \
            liquidsoap --check /app/radio.liq
      - name: Build playout container
        run: docker build -t louder-playout-ci studio/node
