name: Cloud Studio CI
on:
  push:
    branches: [cloud-studio-v1]
    paths: ["studio/**", ".github/workflows/cloud-studio-ci.yml"]
  pull_request:
    paths: ["studio/**", ".github/workflows/cloud-studio-ci.yml"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser code syntax
        run: node --check studio/app.js
      - name: Required SAM-style modules
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("studio/index.html").read_text()
          required=[
            "Voice FX / Microphone","Encoders","PAL Scripts","Clockwheel",
            "Event Scheduler","Crossfade Rules","Audio Mixer Pipeline",
            "Sound FX","Deck A","Deck B","Aux 1","Aux 2","Aux 3","Requests"
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit("Missing: "+", ".join(missing))
          print("All required Studio modules present.")
          PY
