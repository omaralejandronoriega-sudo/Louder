name: Louder Artistas

on:
  push:
    branches: [main]
    paths:
      - "scripts/migrate_from_wp.py"
      - ".github/workflows/artistas.yml"
  workflow_dispatch:
    inputs:
      refresh:
        description: "Volver a leer perfiles ya migrados"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: louder-artistas
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m py_compile scripts/*.py live/*.py

      - name: Migrate current Artistas catalog
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.refresh }}" = "true" ]; then
            EXTRA="--refresh"
          fi
          python scripts/migrate_from_wp.py --delay 0.65 $EXTRA

      - name: Save normalized snapshot
        shell: bash
        run: |
          git config user.name "louder-artistas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/artists.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update Artistas static snapshot"
            git pull --rebase origin main
            git push
          fi
