name: Verify Search Console File

on:
  push:
    paths:
      - ".github/workflows/verify-search-console-file.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public Google file
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          URL="https://artistas.loudermx.com/google532e3e75045a6bdc.html"
          BODY="$(curl -fsSL --max-time 30 "$URL")"
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$URL")"
          printf '%s\n' "$BODY" > diagnostics/search-console-verification-body.txt
          python - <<'PY'
          import json, pathlib
          expected="google-site-verification: google532e3e75045a6bdc.html"
          body=pathlib.Path("diagnostics/search-console-verification-body.txt").read_text().strip()
          out={"url":"https://artistas.loudermx.com/google532e3e75045a6bdc.html","content_matches":body==expected,"body":body}
          pathlib.Path("diagnostics/search-console-verification.json").write_text(json.dumps(out,indent=2)+"\n")
          if body != expected:
              raise SystemExit("Verification body does not match")
          print(json.dumps(out,indent=2))
          PY
          test "$CODE" = "200"
      - name: Persist diagnostic
        if: always()
        run: |
          git config user.name "louder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostics/search-console-verification.json diagnostics/search-console-verification-body.txt
          git commit -m "chore: verify Search Console file" || exit 0
          git pull --rebase origin main
          git push
