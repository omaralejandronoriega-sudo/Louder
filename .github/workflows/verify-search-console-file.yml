name: Verify Artistas Sitemap

on:
  push:
    paths:
      - ".github/workflows/verify-search-console-file.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public Google file
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          URL="https://artistas.loudermx.com/sitemap.xml"
          BODY="$(curl -fsSL --max-time 30 "$URL")"
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$URL")"
          printf '%s\n' "$BODY" > diagnostics/search-console-verification-body.txt
          python - <<'PY'
          import json, pathlib, requests
          import xml.etree.ElementTree as ET
          body=pathlib.Path("diagnostics/search-console-verification-body.txt").read_text().strip()
          parse_ok=True
          error=None
          url_count=0
          try:
              root=ET.fromstring(body)
              url_count=len(root.findall("{http://www.sitemaps.org/schemas/sitemap/0.9}url"))
          except Exception as e:
              parse_ok=False
              error=str(e)
          g=requests.get("https://artistas.loudermx.com/sitemap.xml",headers={"User-Agent":"Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"},timeout=30,allow_redirects=True)
          rb=requests.get("https://artistas.loudermx.com/robots.txt",headers={"User-Agent":"Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"},timeout=30,allow_redirects=True)
          out={
            "url":"https://artistas.loudermx.com/sitemap.xml",
            "parse_ok":parse_ok,
            "url_count":url_count,
            "error":error,
            "prefix":body[:200],
            "googlebot_status":g.status_code,
            "googlebot_content_type":g.headers.get("content-type"),
            "robots_status":rb.status_code,
            "robots":rb.text[:500]
          }
          pathlib.Path("diagnostics/search-console-verification.json").write_text(json.dumps(out,indent=2)+"\n")
          if not parse_ok or url_count < 1:
              raise SystemExit("Invalid or empty sitemap")
          print(json.dumps(out,indent=2))
          PY
          test "$CODE" = "200"
      - name: Persist diagnostic
        if: always()
        run: |
          git config user.name "louder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostics/search-console-verification.json diagnostics/search-console-verification-body.txt
          git commit -m "chore: verify Search Console file" || exit 0
          git pull --rebase origin main
          git push
