name: Audit Louder Artistas

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_artistas.py"
      - ".github/workflows/artistas-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: louder-artistas-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m py_compile scripts/*.py live/*.py

      - name: Rebuild current historical baseline
        run: python scripts/merge_history_sources.py

      - name: Apply current live YesStreaming history
        run: python live/sync_history.py --require-min 7000

      - name: Run audit against current deploy data
        run: python scripts/audit_artistas.py

      - name: Save audit report only
        shell: bash
        run: |
          git checkout -- data/artists.json
          git config user.name "louder-artistas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostics/artistas-audit.json diagnostics/artistas-audit.md
          if git diff --cached --quiet; then
            echo "Audit unchanged"
          else
            git commit -m "Update Artistas completeness audit"
            git pull --rebase origin main
            git push
          fi
