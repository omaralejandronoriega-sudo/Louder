name: Publish Louder Static Sections
# History pipeline v2

on:
  push:
    branches: [main]
    paths:
      - "data/artists.json"
      - "data/history/**"
      - "data/galleries.json"
      - "data/identity_enrichment.json"
      - "data/artist_review_overrides.json"
      - "data/album_art.json"
      - "data/radar_2026.json"
      - "data/control.json"
      - "assets/**"
      - "search-console/**"
      - "scripts/merge_history_sources.py"
      - "scripts/build_artists.py"
      - "scripts/enrich_identity_fallback.py"
      - "scripts/build_radar_2026.py"
      - "scripts/build_control.py"
      - "scripts/build_artist_progress.py"
      - ".github/workflows/artistas-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: louder-static-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Validate Python
        run: python -m py_compile scripts/*.py live/*.py

      - name: Merge Last.fm, MegaSeg and YesStreaming
        run: python scripts/merge_history_sources.py

      - name: Apply current YesStreaming playout order
        run: python live/sync_history.py --require-min 7000

      - name: Refuse incomplete artist catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("data/artists.json").read_text(encoding="utf-8"))
          count=len(data.get("artists") or [])
          print(f"artists={count}")
          if count < 7000:
              raise SystemExit("Refusing Pages deploy: merged Artistas catalog is incomplete")
          print(data.get("history_merge") or {})
          PY

      - name: Enforce Radar 2026 invariant
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("data/radar_2026.json").read_text(encoding="utf-8"))
          bad=[x for x in data.get("tracks",[]) if x.get("original_release_year") != 2026 or not str(x.get("original_release_date","")).startswith("2026")]
          if bad:
              raise SystemExit(f"Refusing Pages deploy: {len(bad)} Radar tracks are not original 2026 entries")
          print(f"radar_tracks={len(data.get('tracks') or [])}")
          PY

      - name: Build static sections
        run: |
          python scripts/build_artists.py
          python scripts/build_radar_2026.py
          python scripts/build_control.py
          python scripts/build_artist_progress.py

      - name: Validate Louder Control PWA
        shell: bash
        run: |
          test -s docs/control/index.html
          test -s docs/artistas/foals/index.html
          test "$(find docs/artistas -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -ge 1000
          test -s docs/control/artistas/index.html
          test -s docs/artistas/_control/index.html
          test -s docs/control/sw.js
          test -s docs/control/manifest.webmanifest
          python -m json.tool docs/control/manifest.webmanifest >/dev/null
          node --check docs/control/sw.js
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('docs/control/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?![^>]*application\/json)[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
          if(!scripts.length) throw new Error('No app JavaScript found');
          fs.writeFileSync('/tmp/louder-control.js',scripts.join('\n'));
          NODE
          node --check /tmp/louder-control.js
          grep -q "Louder Control" docs/control/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
