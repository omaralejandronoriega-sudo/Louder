<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agencia Louder</title>
<style>
:root{--bg:#f4f2ed;--ink:#111;--card:#fff;--line:#d8d5ce;--green:#6cff3e;--purple:#7a3cff;--red:#d83b4b;--amber:#d58a00;--muted:#6d6a65}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:#0c0c0d;color:#fff;padding:24px 16px}.logo{font:900 23px Georgia,serif;margin-bottom:28px}.logo b{color:var(--green)}nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#aaa;padding:12px;border-radius:9px;margin:3px 0;font-weight:700}nav button.active{background:#202024;color:#fff}
main{padding:28px;max-width:1500px;width:100%}.head{display:flex;justify-content:space-between;gap:20px;align-items:center}.head h1{font:900 34px Georgia,serif;margin:0}.live{background:#e7f8df;border:1px solid #b5dda6;padding:9px 12px;border-radius:999px;font-weight:800}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.metric,.person,.task,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px}.metric{padding:16px}.metric strong{display:block;font-size:27px;margin-top:5px}
h2{font:900 20px Georgia,serif}.team{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.person{padding:15px}.avatar{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;background:#111;color:var(--green);font-weight:900}.role{color:var(--purple);font-weight:900;font-size:12px;text-transform:uppercase;margin:10px 0 5px}.person p{font-size:13px;color:var(--muted);min-height:48px}.status{font-size:12px;font-weight:900}.ok{color:#258113}.bad{color:var(--red)}.wait{color:var(--amber)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}.column{min-width:0}.column h3{text-transform:uppercase;font-size:12px;letter-spacing:.08em;color:var(--muted)}.task{padding:13px;margin-bottom:10px}.task b{display:block}.meta{font-size:12px;color:var(--muted);margin:7px 0}.tag{display:inline-block;background:#eee;border-radius:99px;padding:4px 7px;font-size:11px;font-weight:800}.proof{margin-top:9px;font-size:11px}.panel{padding:16px;margin-top:20px}.row{display:grid;grid-template-columns:160px 1fr 140px 110px;gap:10px;border-top:1px solid #eee;padding:10px 0;align-items:center;font-size:13px}.hidden{display:none}
@media(max-width:1000px){.app{grid-template-columns:1fr}aside{display:none}.metrics,.team,.board{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}}@media(max-width:650px){main{padding:16px}.metrics,.team,.board{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside><div class="logo">AGENCIA <b>LOUDER</b></div><nav>
<button class="active">◉ Hoy</button><button>▦ Calendario</button><button>✓ Contenido</button><button>⚙ Automatizaciones</button><button>! Incidencias</button><button>↗ Publicado</button>
</nav></aside><main>
<div class="head"><div><h1>Buenos días, Omar.</h1><div style="color:var(--muted)">Tu equipo digital y sus entregas de hoy.</div></div><div class="live" id="global">● Supervisando</div></div>
<section class="metrics"><div class="metric">Tareas de hoy<strong id="tasks">—</strong></div><div class="metric">Completadas<strong id="done">—</strong></div><div class="metric">En curso<strong id="doing">—</strong></div><div class="metric">Incidencias<strong id="issues">—</strong></div></section>
<h2>Equipo de la agencia</h2><section class="team" id="team"></section>
<div class="panel"><h2>Tablero de producción de hoy</h2><section class="board"><div class="column"><h3>Por preparar</h3><div id="todo"></div></div><div class="column"><h3>En producción</h3><div id="production"></div></div><div class="column"><h3>Programado</h3><div id="scheduled"></div></div><div class="column"><h3>Publicado y verificado</h3><div id="published"></div></div></section></div>
<div class="panel"><h2>Salud de operaciones</h2><div id="ops"></div></div>
</main></div>
<script>
const people=[{id:'valeria',name:'Valeria Cruz',initials:'VC',role:'Directora editorial',area:'Dirección',desc:'Define prioridades, asigna el trabajo del día y supervisa entregas.',repo:'omaralejandronoriega-sudo/Louder',workflow:'web-health.yml'},
{id:'tomas',name:'Tomás Arriaga',initials:'TA',role:'Redactor / periodista musical',area:'Editorial Louder',desc:'Investiga y redacta notas para el flujo editorial.',repo:'omaralejandronoriega-sudo/louder-prensa',workflow:'revisar-correo.yml'},
{id:'elena',name:'Elena Vidal',initials:'EV',role:'Curadora musical',area:'Curaduría',desc:'Detecta lanzamientos, efemérides y oportunidades editoriales.',repo:'omaralejandronoriega-sudo/Louder',workflow:'radar-2026.yml'},
{id:'gael',name:'Gael Robles',initials:'GR',role:'Productor de contenidos',area:'Producción',desc:'Convierte temas en paquetes para web, diseño, video y redes.',repo:'omaralejandronoriega-sudo/Louder',workflow:'wordpress-cron.yml'},
{id:'leo',name:'Leo Barragán',initials:'LB',role:'Control de calidad y automatizaciones',area:'Operaciones',desc:'Verifica publicaciones, atrasos, recuperación y comprobantes.',repo:'omaralejandronoriega-sudo/Louder',workflow:'web-health.yml'},
{id:'camila',name:'Camila Ortega',initials:'CO',role:'Analista de audiencia',area:'Métricas',desc:'Analiza resultados y alimenta la planeación de la siguiente jornada.',repo:'omaralejandronoriega-sudo/Louder',workflow:'web-health.yml'},
{id:'mateo',name:'Mateo Ríos',initials:'MR',role:'Editor de video · TikTok',area:'TikTok Louder',desc:'Recibe la pieza del día, edita el video vertical y deja el archivo listo para publicación.',repo:'omaralejandronoriega-sudo/louder-tiktok-capture',workflow:'capture.yml'},
{id:'ines',name:'Inés Beaumont',initials:'IB',role:'Diseñadora · The British Corner',area:'The British Corner',desc:'Crea la pieza gráfica de cada publicación con identidad editorial británica.',repo:'omaralejandronoriega-sudo/the-british-corner',workflow:'facebook-production.yml'},
{id:'arthur',name:'Arthur Vega',initials:'AV',role:'Community Manager · The British Corner',area:'The British Corner',desc:'Recibe diseños y copy, programa los cuatro slots y comprueba cada publicación.',repo:'omaralejandronoriega-sudo/the-british-corner',workflow:'facebook-slot-publisher.yml'},
{id:'mara',name:'Mara Vértiz',initials:'MV',role:'Diseñadora · Threads',area:'Louder Threads',desc:'Prepara recursos visuales cuando la publicación de Threads requiere imagen.',repo:'omaralejandronoriega-sudo/louder-threads-hourly',workflow:'newsroom-v2.yml'},
{id:'nico',name:'Nico Ferrer',initials:'NF',role:'Community Manager · Threads',area:'Louder Threads',desc:'Gestiona la salida horaria, variedad editorial y comprobación de cada post.',repo:'omaralejandronoriega-sudo/louder-threads-hourly',workflow:'hourly.yml'},
{id:'renata',name:'Renata Solís',initials:'RS',role:'Diseñadora · Louder',area:'Redes Louder',desc:'Produce artes de noticias, efemérides, discos, programación y piezas especiales.',repo:'omaralejandronoriega-sudo/Louder',workflow:'radar-2026.yml'},
{id:'diego',name:'Diego Lunares',initials:'DL',role:'Editor de video · Louder',area:'Redes Louder',desc:'Produce reels, noticias en video y formatos verticales para redes de Louder.',repo:'omaralejandronoriega-sudo/louder-tiktok-capture',workflow:'capture.yml'},
{id:'sofia',name:'Sofía Alcázar',initials:'SA',role:'Community Manager · Louder',area:'Redes Louder',desc:'Coordina publicaciones, horarios y comprobantes en las redes de Louder.',repo:'omaralejandronoriega-sudo/louder-threads-hourly',workflow:'threads-native.yml'},
{id:'bruno',name:'Bruno Leal',initials:'BL',role:'Webmaster · Louder',area:'loudermx.com',desc:'Recibe las notas aprobadas, publica en la web y entrega la URL final a Sofía.',repo:'omaralejandronoriega-sudo/Louder',workflow:'wordpress-cron.yml'}
];
const repos=[...new Set(people.map(p=>p.repo)), 'omaralejandronoriega-sudo/louder-prensa'];
let runs=[];
const state=r=>!r?'wait':(['failure','cancelled','timed_out'].includes(r.conclusion)?'bad':(r.status!=='completed'?'wait':(r.conclusion==='success'?'ok':'wait')));
const label=s=>s==='ok'?'En orden':s==='bad'?'Incidencia':'Trabajando';
function latest(p){return runs.find(r=>r.repo===p.repo && (r.path||'').endsWith(p.workflow))}
function draw(){
 const t=document.getElementById('team');t.innerHTML=people.map(p=>{let s=state(latest(p));return '<article class="person"><div class="avatar">'+p.initials+'</div><div class="role">'+p.role+'</div><b>'+p.name+'</b><div class="meta">'+p.area+'</div><p>'+p.desc+'</p><span class="status '+s+'">● '+label(s)+'</span></article>'}).join('');
 const items=people.map(p=>({p,r:latest(p),s:state(latest(p))}));
 const bad=items.filter(x=>x.s==='bad').length,doing=items.filter(x=>x.s==='wait').length,done=items.filter(x=>x.s==='ok').length;
 tasks.textContent=items.length;document.getElementById('done').textContent=done;document.getElementById('doing').textContent=doing;issues.textContent=bad;
 const buckets={todo:[],production:[],scheduled:[],published:[]};
 items.forEach(x=>{const dest=x.s==='ok'?'published':x.s==='bad'?'production':'scheduled';buckets[dest].push(x)});
 Object.keys(buckets).forEach(k=>document.getElementById(k).innerHTML=buckets[k].map(x=>'<div class="task"><b>'+x.p.area+'</b><div class="meta">'+x.p.name+' ('+x.p.role+')'+'</div><span class="tag">'+label(x.s)+'</span><div class="proof">'+(x.r?'Última actividad: '+new Date(x.r.created_at).toLocaleString('es-MX'):'Esperando primera actividad')+'</div></div>').join('')||'<div class="meta">Sin tareas aquí.</div>');
 document.getElementById('ops').innerHTML=items.map(x=>'<div class="row"><b>'+x.p.name+'</b><span>'+x.p.area+'</span><span class="status '+x.s+'">● '+label(x.s)+'</span><span>'+(x.r?new Date(x.r.created_at).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}):'—')+'</span></div>').join('');
 global.textContent=bad?'● '+bad+' incidencia(s) en recuperación':'● Operación supervisada';
}
async function load(){let all=[];for(const repo of repos){try{let j=await (await fetch('https://api.github.com/repos/'+repo+'/actions/runs?per_page=40')).json();(j.workflow_runs||[]).forEach(r=>all.push({...r,repo}))}catch(e){}}runs=all.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));draw()}
load();setInterval(load,60000);
</script></body></html>
